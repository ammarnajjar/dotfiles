# Create new window with current directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

set -g history-limit 1000000
set -s escape-time 0

# reload config using PREFIX r
bind R source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Make the current window the first window
bind T swap-window -t 1

# map Vi movement keys as pane movement keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes using PREFIX H, J, K, L
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# status bar
set -g status-bg black
set -g status-fg white

# active window title colors
set-window-option -g window-status-current-style fg=green,bg=default,bright

set -g mouse on
set -g default-shell $SHELL
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g focus-events on
set -g renumber-windows on
set -g set-clipboard on
set-window-option -g mode-keys vi

if-shell "uname | grep -q Darwin" \
    "bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'pbcopy'; \
     bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'pbcopy'" \
    "bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'xclip -selection clipboard'; \
     bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'xclip -selection clipboard'"
